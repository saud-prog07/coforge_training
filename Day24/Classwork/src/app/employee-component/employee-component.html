<b>
    <form #employeeForm = "ngForm" (ngSubmit)="saveEmployee(employeeForm.value)">
        <br>Employee Details
        <br>Employee Id <input type="text" name = "eid" #eid = "ngModel" ngModel />
        <br>Employee Name <input type="text" name = "ename" #ename = "ngModel" ngModel/>
        <br>Employee Salary <input type="text" name = "salary" #salary = "ngModel" ngModel />
        <br>Employee Department <input type="text" name = "dno" #dno = "ngModel" ngModel />
        <br><button value = "Save Employee" name = "emsButton" #emsButton = "ngModel" ngModel>Save Employee</button>
        <br>Result : {{result}}
     </form>
</b>
